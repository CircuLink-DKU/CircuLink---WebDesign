server {
    server_name circulink.cn www.circulink.cn 139.196.139.118;

    root /var/www/circulink/dist;
    index index.html;

    # Keep in sync with express.json/multer limits (10MB) in the API.
    client_max_body_size 10m;

    # Baseline security headers (inherited by locations that don't set their own
    # add_header). `expires` in the cache blocks below does not clobber these.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Strict-Transport-Security "max-age=15552000; includeSubDomains" always;

    # Compression for text assets.
    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_vary on;
    gzip_proxied any;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        application/xml
        image/svg+xml;

    # The compiled Express server is emitted into dist/server by `build:server`.
    # It must never be served as a static asset.
    location ^~ /server/ {
        deny all;
        return 404;
    }

    location = /api/healthz {
        proxy_pass http://127.0.0.1:4000/healthz;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location ^~ /api/ {
        proxy_pass http://127.0.0.1:4000/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location ^~ /uploads/ {
        proxy_pass http://127.0.0.1:4000/uploads/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # User uploads use content-addressable-ish names; cache them at the edge.
        expires 7d;
    }

    # Hashed Vite build assets are immutable — cache aggressively.
    location ^~ /assets/ {
        expires 30d;
        access_log off;
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    listen 443 ssl;
    listen [::]:443 ssl;
    ssl_certificate /etc/letsencrypt/live/circulink.cn/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/circulink.cn/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
}

server {
    listen 80;
    listen [::]:80;
    server_name circulink.cn www.circulink.cn;

    return 301 https://$host$request_uri;
}
